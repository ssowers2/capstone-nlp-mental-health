# Lychee link checker configuration
# Used by GitHub Actions to validate links in project documentation.

verbose = "info"
no_progress = true

max_concurrency = 6
max_retries = 3
retry_wait_time = 8
timeout = 30

accept = [
  200,
  206,
  301,
  302,
  307,
  308,
  403,
  429,
  503,
]

exclude = [
  "example\\.com",
  "localhost",
  "127\\.0\\.0\\.1",
  "\\.local",
]
